---
layout: page
load_leaflet: 1
---

<h1 style="float:right; font-size:64pt; color:#f1f1f1">{{page.title}}</h1>
<h2 id="wikidata_title"></h2>
<h3 id="wikidata_descr"></h3>
<a id="wikidata_href" target="_blank"><img src = "https://upload.wikimedia.org/wikipedia/commons/archive/5/5a/20211013163259%21Wikipedia%27s_W.svg" alt="Wikipedia link" height="20px"/> <span id="wikipedia_title"> </a>
<p id="wikidata_location"></p>

<img id="wikidata_img" style="width:100%; padding-bottom:5px;" />

<div id="map" style="height: 180px; width:100%; background-color:lightgrey"></div>

{% if page.dish %}
<div id="dish" style="display:none; margin:30px 0; padding:20px; background:#fff; border:1px solid #e6dccb; border-left:5px solid #6b7a3a; border-radius:10px;">
  <h2 id="dish_title" style="margin-top:0"></h2>
  <p id="dish_descr" style="color:#7d776d"></p>
  <img id="dish_img" style="width:100%; max-height:420px; object-fit:cover; display:none;" alt="">
  <p><a id="dish_link" target="_blank" rel="noopener"></a></p>
</div>
{% endif %}

{{ content }}

<img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Wikidata_Stamp_Rec_Light.svg" style="float:right; width:100px" />

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
<script>var wikidatum = '{{page.wikidatum}}'</script>
<script src="{{ '/assets/js/get_wiki_item.js' | relative_url }}"></script>

{% if page.dish %}
<script>
(function () {
  var id = '{{ page.dish }}';
  var url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + id +
    '&props=labels|descriptions|claims|sitelinks&languages=el|en&format=json&origin=*';

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var e = data.entities && data.entities[id];
      if (!e || e.missing !== undefined) return;

      var label = (e.labels.el || e.labels.en || {}).value || id;
      var descr = (e.descriptions.el || e.descriptions.en || {}).value || '';

      document.getElementById('dish_title').textContent = label;
      document.getElementById('dish_descr').textContent = descr;

      // Image (P18) from Wikimedia Commons
      var p18 = e.claims && e.claims.P18;
      if (p18 && p18[0].mainsnak.datavalue) {
        var file = p18[0].mainsnak.datavalue.value;
        var img = document.getElementById('dish_img');
        img.src = 'https://commons.wikimedia.org/wiki/Special:FilePath/' +
                  encodeURIComponent(file) + '?width=900';
        img.alt = label;
        img.style.display = 'block';
      }

      // Wikipedia link (Greek first, then English), else Wikidata
      var link = document.getElementById('dish_link');
      var sl = e.sitelinks || {};
      if (sl.elwiki) {
        link.href = 'https://el.wikipedia.org/wiki/' + encodeURIComponent(sl.elwiki.title.replace(/ /g, '_'));
        link.textContent = 'Περισσότερα στη Βικιπαίδεια';
      } else if (sl.enwiki) {
        link.href = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(sl.enwiki.title.replace(/ /g, '_'));
        link.textContent = 'Περισσότερα στη Wikipedia';
      } else {
        link.href = 'https://www.wikidata.org/wiki/' + id;
        link.textContent = 'Δείτε το στο Wikidata';
      }

      document.getElementById('dish').style.display = 'block';
    })
    .catch(function (err) { console.error('Dish load failed', err); });
})();
</script>
{% endif %}
