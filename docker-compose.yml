services:
  jekyll:
    image: ruby:3.2
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"
    command: sh -c "bundle install && bundle exec jekyll serve -b '' --host 0.0.0.0 --force_polling --livereload"

volumes:
  bundle:
